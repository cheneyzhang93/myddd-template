name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 框架构件从哪来：CI 环境没有本地 m2，必须先把 myddd 框架装进仓库缓存，或把私服 settings.xml 挂上。
      # 仓库变量 MYDDD_FRAMEWORK_REPO 填你自己的框架仓地址（内网 GitLab 同理，配 secrets 里的只读 token）。
      # 走私服/Nexus 的话删掉这一步，改为提交 settings.xml 并给 mvn 加 -s。
      - name: 构建 myddd 框架（装入本地仓库）
        env:
          MYDDD_FRAMEWORK_REPO: ${{ vars.MYDDD_FRAMEWORK_REPO }}
        run: |
          set -euo pipefail
          [ -n "$MYDDD_FRAMEWORK_REPO" ] || { echo "::error::未配置仓库变量 MYDDD_FRAMEWORK_REPO（myddd 框架的 git 地址）"; exit 1; }
          git clone --depth 1 "$MYDDD_FRAMEWORK_REPO" /tmp/myddd-framework
          mvn -B -ntp -f /tmp/myddd-framework/pom.xml -DskipTests install
      - name: Build and verify
        run: ./mvnw -B -ntp clean install
      - name: 集成测试真实执行断言（防"CI 上 IT 被静默跳过"）
        run: |
          set -euo pipefail
          # 本机没有 Docker 时整类跳过是设计内行为；CI runner 有 Docker，跳过就是环境出错，必须判红。
          total=0
          skipped=0
          files=0
          while IFS= read -r xml; do
            files=$((files + 1))
            t=$(sed -n 's/.*<testsuite[^>]* tests="\([0-9]*\)".*/\1/p' "$xml" | head -1)
            s=$(sed -n 's/.*<testsuite[^>]* skipped="\([0-9]*\)".*/\1/p' "$xml" | head -1)
            total=$((total + ${t:-0}))
            skipped=$((skipped + ${s:-0}))
          done < <(find . -path '*/target/failsafe-reports/TEST-*.xml' | sort)
          echo "failsafe 报告 $files 份，IT 用例 $total 条，跳过 $skipped 条"
          [ "$files" -gt 0 ] || { echo "::error::没有任何 failsafe 报告：IT 要么未编写、要么 verify 阶段被绕过"; exit 1; }
          [ "$total" -gt 0 ] || { echo "::error::failsafe 报告里一条用例都没有（IT 空转）"; exit 1; }
          [ "$skipped" -eq 0 ] || { echo "::error::有 $skipped 条 IT 被跳过——CI 有 Docker，跳过即容器侧出了问题"; exit 1; }
